apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: academy
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jfrancolopez/ls-platform-gitops.git
    targetRevision: main
    path: apps/academy/base
  destination:
    server: https://kubernetes.default.svc
    namespace: academy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true